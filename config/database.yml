default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  # Usa a variável DATABASE_HOST do docker-compose ou assume 'db'
  host: <%= ENV.fetch("DATABASE_HOST") { "db" } %>
  username: <%= ENV.fetch("POSTGRES_USER") { "admin" } %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD") { "root" } %>
  port: 5432

development:
  <<: *default
  database: sistema_fretes_development

test:
  <<: *default
  database: sistema_fretes_test

production:
  primary: &primary_production
    <<: *default
    database: sistema_fretes_production
  cache:
    <<: *primary_production
    database: sistema_fretes_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: sistema_fretes_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: sistema_fretes_production_cable
    migrations_paths: db/cable_migrate